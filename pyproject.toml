[project]
name = "hyperliquid-whale-tracker"
version = "0.1.0"
description = "Real-time whale radar for Hyperliquid"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "websockets>=12",
  "redis>=5",
  "pydantic>=2.6",
  "structlog>=24",
  "prometheus-client>=0.20",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "fastapi>=0.110",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "hypothesis>=6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
